# Lockstep release: one version across every publishable package, no
# changesets. Trigger it manually with a bump keyword or an exact version;
# it gates on the full check suite, commits the bump, tags, publishes with
# an npm automation token (no OTP), and cuts a GitHub release.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "patch | minor | major | exact x.y.z"
        required: true
        default: patch

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build

      - name: Bump versions in lockstep
        id: bump
        run: echo "version=$(bun .github/scripts/bump.ts "${{ inputs.version }}")" >> "$GITHUB_OUTPUT"

      # Tolerates a retry after a failed publish: the bump commit and the
      # tag may already exist from the earlier attempt.
      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || git commit -am "chore: release v${{ steps.bump.outputs.version }}"
          git rev-parse -q --verify "refs/tags/v${{ steps.bump.outputs.version }}" >/dev/null \
            || git tag "v${{ steps.bump.outputs.version }}"
          git push --follow-tags

      # The per-package .npmrc holds an env reference, never the token
      # itself; bun expands it at publish time.
      - name: Publish to npm
        run: |
          for pkg in core cli ai-effect anthropic openai opencode; do
            echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > "packages/$pkg/.npmrc"
            (cd "packages/$pkg" && bun publish --access public)
            rm "packages/$pkg/.npmrc"
          done
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub release
        run: gh release create "v${{ steps.bump.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
