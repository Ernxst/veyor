# Lockstep release: one version across every publishable package, no
# changesets. Trigger it manually with a bump keyword or an exact version;
# it gates on the full check suite, commits the bump, tags, publishes with
# an npm automation token (no OTP), and cuts a GitHub release.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "patch | minor | major | exact x.y.z"
        required: true
        default: patch

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build

      - name: Bump versions in lockstep
        id: bump
        run: echo "version=$(bun .github/scripts/bump.ts "${{ inputs.version }}")" >> "$GITHUB_OUTPUT"

      # Tolerates a retry after a failed publish: the bump commit and the
      # tag may already exist from the earlier attempt.
      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || git commit -am "chore: release v${{ steps.bump.outputs.version }}"
          git rev-parse -q --verify "refs/tags/v${{ steps.bump.outputs.version }}" >/dev/null \
            || git tag "v${{ steps.bump.outputs.version }}"
          # --follow-tags skips lightweight tags; push the tag explicitly.
          git push origin main "v${{ steps.bump.outputs.version }}"

      # npm does not understand workspace:*, so a publish-time rewrite
      # (never committed) pins workspace deps to the released versions.
      # The .npmrc holds an env reference, never the token itself.
      - name: Publish to npm
        run: |
          bun .github/scripts/prepare-publish.ts
          # The root devEngines pins bun for development; it must not gate
          # npm-driven publishing. Transient, like the workspace rewrite.
          node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("package.json","utf8"));delete j.devEngines;fs.writeFileSync("package.json",JSON.stringify(j,null,2))'
          echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > "$HOME/.npmrc"
          for pkg in core cli ai-effect anthropic openai opencode cursor; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            if npm view "$name@${{ steps.bump.outputs.version }}" version >/dev/null 2>&1; then
              echo "$name@${{ steps.bump.outputs.version }} already published; skipping"
              continue
            fi
            (cd "packages/$pkg" && npm publish --access public) || {
              # Freshly published versions can lag npm view; the E403
              # "cannot publish over" answers the same question.
              npm view "$name@${{ steps.bump.outputs.version }}" version >/dev/null 2>&1 \
                && echo "$name@${{ steps.bump.outputs.version }} raced propagation; already published" \
                || exit 1
            }
          done
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub release
        run: gh release create "v${{ steps.bump.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
